services:
  
  aptly:
    
    build: .
    container_name: aptly
    
    ports:
      - "127.0.0.1:8090:8080"
    
    environment:
      - GNUPGHOME=/gpg
    
    volumes:
      # config local bind, read-only
      - ./aptly.conf:/etc/aptly.conf:ro
      # gpg local bind, read-write (nicht /root/.gnupg!)
      - ./gpg:/gpg:rw
      # aptly data as named volume
      - aptly-data:/aptly

    labels:
      - com.centurylinklabs.watchtower.enable=false
    
    restart: unless-stopped
    
    mem_limit: 256m
    memswap_limit: 512m
    cpus: "0.5"

volumes:
  aptly-data:
    name: aptly-data
